services:
  - type: web
    name: cellular-legends
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /tmp/cellular-legends-data
